# Category words: a filename token, folder name or source category matching a word gives the
# dossier that tag. Plurals (donuts, boxes, berries) match automatically; add synonyms as words.
# Edit by copying this file to your definitions folder (lexicons/category.toml) or let Exchange
# write it when you accept "add word" suggestions. Your copy replaces this one.

