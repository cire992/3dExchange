# Daz Studio: one environment gathers every content directory (a folder holding data/, Runtime/,
# People/ ...), including the Daz Connect one. Container = a content directory; products come
# from DIM support manifests (hints, not truth) and Daz Connect product folders.

[environment]
id = "daz_studio"
name = "Daz Studio"
format_version = 1
multi_root = true

[detection]
min_confidence = 0.5

[[detection.signature]]
kind = "dir"
path = "data"
weight = 0.3

[[detection.signature]]
kind = "dir"
path = "Runtime"
weight = 0.2

[[detection.signature]]
kind = "dir"
path = "Runtime/Support"
weight = 0.3

[[detection.signature]]
kind = "dir"
path = "data/cloud"
weight = 0.3

[[detection.signature]]
kind = "dir"
path = "People"
weight = 0.2

[[detection.signature]]
kind = "glob"
glob = "**/*.duf"
weight = 0.2

[layer]
handler = "daz"

[layer.options]
manifest_glob = "Runtime/Support/*.dsx"

# A manifest's Assets carry a Daz ContentType. Assets whose type starts with one of these become
# child dossiers of that type (the longest match wins); the rest stay files of the product.
[layer.options.content_types]
"Actor" = "daz_figure"
"Actor/Character" = "daz_character_preset"
"Figure" = "daz_figure"
"Follower/Hair" = "daz_hair"
"Follower/Wardrobe" = "daz_wearable"
"Preset/Character" = "daz_character_preset"
"Preset/Hair" = "daz_hair"
"Preset/Materials" = "texture_set"
"Preset/Morph" = "daz_morph"
"Preset/Wearables" = "daz_wearable"
"Prop" = "daz_prop"

# Saved files (a character, outfit or scene subset saved from Daz Studio) are in no manifest and in
# no folder a rule knows, so the file says what it is: the asset_info.type in its first 64 KB maps
# to a dossier type. Only .duf files outside data/ and Runtime/ are read; a type not listed here
# leaves the file unattached.
[layer.options.asset_types]
character = "daz_character_preset"
wearable = "daz_wearable"
scene_subset = "daz_scene_subset"

# An Asset's Compatibility (e.g. "/Genesis 9/Female") names its figure generation.
[layer.options.compatibility_variants]
"/Genesis 9" = "genesis_9"
"/Genesis 8" = "genesis_8"
"/Genesis 8.1" = "genesis_8"
"/Genesis 3" = "genesis_3"
"/Genesis 2" = "genesis_2"

[capabilities]
indexable = true
readable = true
writable = false   # requisition endpoints arrive in Roadmap phase 4

# Figure generations are dossier-level variants: one library holds content for several.
[[variant]]
id = "genesis_9"
name = "Genesis 9"
level = "dossier"
globs = ["People/Genesis 9/**", "data/**/Genesis 9/**"]

[[variant]]
id = "genesis_8"
name = "Genesis 8"
level = "dossier"
globs = ["People/Genesis 8*/**", "data/**/Genesis 8*/**"]

[[variant]]
id = "genesis_3"
name = "Genesis 3"
level = "dossier"
globs = ["People/Genesis 3*/**", "data/**/Genesis 3/**"]

[[variant]]
id = "genesis_2"
name = "Genesis 2"
level = "dossier"
globs = ["People/Genesis 2*/**", "data/**/Genesis 2/**"]

[compatibility]
uses_content_from = []
native_dossier_types = ["daz_figure", "daz_character_preset", "daz_morph", "daz_wearable", "daz_hair", "daz_prop", "daz_scene_subset"]
