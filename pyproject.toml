[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exchange"
version = "0.1.0"
description = "Manage 3D assets across game, engine and content-library environments."
readme = "README.md"
requires-python = ">=3.11"
# Pillow decodes and resizes images (including DDS) for thumbnails; numpy drives the small
# mesh renderer that previews glTF/OBJ files. PyYAML reads project homes' front matter (YAML, as
# the game data model chose). Everything else is the standard library.
dependencies = [
    "pillow>=10",
    "numpy>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
ui = ["PySide6>=6.7", "watchdog>=4"]
# The local service the desktop shell's Workspace window talks to (`exchange serve`); watchdog gives
# it change notices (optional at run time, as in the window).
service = ["fastapi>=0.115", "uvicorn>=0.30", "watchdog>=4"]
dev = ["pytest>=8", "pytest-qt>=4.4", "PySide6>=6.7", "watchdog>=4", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.scripts]
exchange = "exchange.cli:main"

[project.gui-scripts]
exchange-app = "exchange_ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"exchange.db" = ["migrations/*.sql"]
"exchange.definitions" = ["builtin/environments/*.toml", "builtin/dossier_types/*.toml", "builtin/lexicons/*.toml"]
"exchange.projects" = ["schemas/*.yaml"]
"exchange.processes" = ["builtin/*/process.toml", "builtin/*/operations/*.py", "builtin/*/scripts/*", "builtin/*/templates/*", "builtin/*/presets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
