[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exchange"
version = "0.1.0"
description = "Manage 3D assets across game, engine and content-library environments."
readme = "README.md"
requires-python = ">=3.11"
# Pillow decodes and resizes images (including DDS) for thumbnails; numpy drives the small
# mesh renderer that previews glTF/OBJ files. Everything else is the standard library.
dependencies = [
    "pillow>=10",
    "numpy>=1.26",
]

[project.optional-dependencies]
ui = ["PySide6>=6.7"]
dev = ["pytest>=8", "pytest-qt>=4.4", "PySide6>=6.7"]

[project.scripts]
exchange = "exchange.cli:main"

[project.gui-scripts]
exchange-app = "exchange_ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"exchange.db" = ["migrations/*.sql"]
"exchange.definitions" = ["builtin/environments/*.toml", "builtin/dossier_types/*.toml", "builtin/lexicons/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
