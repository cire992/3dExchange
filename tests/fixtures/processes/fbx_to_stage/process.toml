# First of a two-process chain: .fbx files to a made-up stage.

[process]
id = "fbx_to_stage"
name = "FBX to stage"
version = "1.0.0"
author = "Tests"
format_version = 1

[input]
dossier_types = ["mesh"]
extensions = [".fbx"]
artifact = "Files"

[output]
environment = "stage"
folder = "Read/{name}"

[[step]]
id = "pass"
operation = "core.copy"
