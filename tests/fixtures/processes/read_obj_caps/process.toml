# A test process that declares its extension in capitals.

[process]
id = "read_obj_caps"
name = "Read OBJ (caps)"
version = "1.0.0"
author = "Tests"
format_version = 1

[input]
dossier_types = ["mesh"]
extensions = [".OBJ"]
artifact = "Files"

[output]
environment = "same"
folder = "Read/{name}"

[[step]]
id = "pass"
operation = "core.copy"
